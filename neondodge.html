<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Dodge - Free Mobile Arcade Game | BELZA Arcade</title>
<meta name="description" content="Neon Dodge is a free arcade game that runs in your phone browser. Drag to dodge, collect orbs and beat your high score. No download needed.">
<meta name="theme-color" content="#07070f">
<meta property="og:title" content="Neon Dodge - Free Mobile Arcade Game">
<meta property="og:description" content="Drag to dodge, collect orbs, beat your high score. Plays instantly on any phone.">
<meta property="og:type" content="website">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
html,body{margin:0;height:100%;background:#07070f;overflow:hidden;touch-action:none;
font-family:system-ui,-apple-system,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;
-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
noscript{position:absolute;top:40%;width:100%;text-align:center}
.back{position:fixed;top:12px;left:12px;z-index:5;color:#9ab;font-size:14px;text-decoration:none;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.07)}
</style>
</head>
<body>
<a class="back" href="index.html">&#8249; Arcade</a>
<canvas id="g"></canvas>
<noscript>Neon Dodge needs JavaScript enabled to play.</noscript>
<script>
(function(){
var c=document.getElementById('g'),x=c.getContext('2d');
var W,H,dpr;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  c.width=W*dpr;c.height=H*dpr;
  x.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);resize();

var best=0;
try{best=+localStorage.getItem('neondodge_best')||0}catch(e){}

var state='menu',p,foes,orbs,parts,score,t,spawn,orbT,shake,overAt=0,newBest=false;
var pt={x:W/2,y:H*0.75};
var stars=[];
for(var i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*H,v:0.3+Math.random()*1.2,s:Math.random()*1.5+0.5});

function reset(){
  p={x:W/2,y:H*0.75,r:11};
  foes=[];orbs=[];parts=[];
  score=0;t=0;spawn=0;orbT=60;shake=0;newBest=false;
  pt.x=p.x;pt.y=p.y;
}
reset();

function burst(X,Y,col,n,sp){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283,s=(0.5+Math.random())*sp;
    parts.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,col:col});
  }
}

function setPt(e){pt.x=e.clientX;pt.y=e.clientY-50;}
c.addEventListener('pointerdown',function(e){
  setPt(e);
  if(state==='menu'||(state==='over'&&performance.now()-overAt>600)){reset();setPt(e);state='play';}
});
c.addEventListener('pointermove',setPt);

function die(){
  state='over';overAt=performance.now();shake=18;
  burst(p.x,p.y,'#0ff',50,6);
  var s=Math.floor(score);
  if(s>best){best=s;newBest=true;try{localStorage.setItem('neondodge_best',best)}catch(e){}}
  if(navigator.vibrate)navigator.vibrate(180);
}

function update(dt){
  var i,s,f,o,q;
  for(i=0;i<stars.length;i++){s=stars[i];s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W;}}
  for(i=0;i<parts.length;i++){q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=0.025*dt;}
  parts=parts.filter(function(q){return q.l>0});
  shake*=0.9;
  if(state!=='play')return;

  t+=dt;
  var k=Math.min(dt,1.5)*0.28;
  p.x+=(pt.x-p.x)*k;p.y+=(pt.y-p.y)*k;
  p.x=Math.max(p.r,Math.min(W-p.r,p.x));
  p.y=Math.max(p.r,Math.min(H-p.r,p.y));
  parts.push({x:p.x,y:p.y+8,vx:(Math.random()-0.5)*0.6,vy:1.5,l:0.5,col:'#0ff'});

  var lvl=1+t/900;
  spawn-=dt;
  if(spawn<=0){
    spawn=Math.max(9,38/lvl);
    var r=10+Math.random()*18;
    foes.push({x:Math.random()*W,y:-r,r:r,vy:(1.8+Math.random()*1.6)*Math.min(lvl,3),vx:(Math.random()-0.5)*1.6});
  }
  orbT-=dt;
  if(orbT<=0){orbT=110+Math.random()*90;orbs.push({x:30+Math.random()*(W-60),y:-10,r:8});}

  for(i=foes.length-1;i>=0;i--){
    f=foes[i];f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.x<f.r||f.x>W-f.r)f.vx*=-1;
    if(f.y>H+f.r){foes.splice(i,1);score+=5;continue;}
    var dx=f.x-p.x,dy=f.y-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<f.r+p.r-3){die();return;}
  }
  for(i=orbs.length-1;i>=0;i--){
    o=orbs[i];o.y+=2.2*dt;
    if(o.y>H+20){orbs.splice(i,1);continue;}
    var ox=o.x-p.x,oy=o.y-p.y;
    if(Math.sqrt(ox*ox+oy*oy)<o.r+p.r+6){
      score+=50;burst(o.x,o.y,'#ff0',18,4);orbs.splice(i,1);
      if(navigator.vibrate)navigator.vibrate(15);
    }
  }
  score+=dt*0.1;
}

function glowCircle(X,Y,R,col,blur){
  x.shadowColor=col;x.shadowBlur=blur;x.fillStyle=col;
  x.beginPath();x.arc(X,Y,R,0,6.283);x.fill();
  x.shadowBlur=0;
}
function text(str,X,Y,size,col,weight){
  x.fillStyle=col||'#fff';x.font=(weight||'600')+' '+size+'px system-ui,sans-serif';
  x.textAlign='center';x.fillText(str,X,Y);
}

function draw(){
  var i;
  x.save();
  x.fillStyle='#07070f';x.fillRect(0,0,W,H);
  if(shake>0.5)x.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  x.fillStyle='#fff';
  for(i=0;i<stars.length;i++){x.globalAlpha=0.15+stars[i].s*0.2;x.fillRect(stars[i].x,stars[i].y,stars[i].s,stars[i].s);}
  x.globalAlpha=1;

  for(i=0;i<parts.length;i++){
    var q=parts[i];x.globalAlpha=Math.max(q.l,0);x.fillStyle=q.col;
    x.fillRect(q.x-1.5,q.y-1.5,3,3);
  }
  x.globalAlpha=1;

  for(i=0;i<orbs.length;i++)glowCircle(orbs[i].x,orbs[i].y,orbs[i].r,'#ff0',18);
  for(i=0;i<foes.length;i++)glowCircle(foes[i].x,foes[i].y,foes[i].r,'#f0a',16);
  if(state!=='over')glowCircle(p.x,p.y,p.r,'#0ff',22);
  x.restore();

  if(state==='play'){
    text(String(Math.floor(score)),W/2,60,40,'#fff','700');
    text('BEST '+best,W/2,86,14,'#8aa','500');
  }else if(state==='menu'){
    text('NEON DODGE',W/2,H*0.38,Math.min(52,W/8),'#0ff','800');
    text('Drag to dodge. Grab the yellow orbs.',W/2,H*0.38+40,16,'#9ab','400');
    text('TAP TO START',W/2,H*0.55,22,'#fff','700');
    if(best)text('Best: '+best,W/2,H*0.55+36,16,'#ff0','500');
  }else{
    text('GAME OVER',W/2,H*0.36,Math.min(46,W/9),'#f0a','800');
    text(String(Math.floor(score)),W/2,H*0.36+60,56,'#fff','800');
    text(newBest?'NEW BEST!':'Best: '+best,W/2,H*0.36+95,18,newBest?'#ff0':'#9ab','600');
    if(performance.now()-overAt>600)text('TAP TO RETRY',W/2,H*0.62,22,'#0ff','700');
  }
}

var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/16.67,3);last=now;
  update(dt);draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
